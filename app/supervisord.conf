[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pulseaudio]
command=/usr/bin/pulseaudio --system --disallow-exit --exit-idle-time=-1 --log-target=stderr
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mediamtx]
command=/opt/mediamtx/mediamtx /app/mediamtx.yml
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:control]
command=/usr/bin/node /app/control.js
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser]
command=/usr/bin/chromium-browser --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required --window-size=1920,1080 --start-fullscreen about:blank
environment=DISPLAY=":99"
autostart=false
autorestart=true
priority=50

[program:controller]
command=/usr/bin/node /app/stream.js
environment=DISPLAY=":99"
autostart=false
autorestart=false
priority=60

[program:ffmpeg]
command=/app/ffmpeg.sh
environment=DISPLAY=":99"
autostart=false
autorestart=true
priority=70

[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf -g "daemon off;"
autorestart=true
priority=80
